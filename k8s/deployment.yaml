apiVersion: apps/v1
kind: Deployment
metadata:
  name: casino-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: casino-frontend
  template:
    metadata:
      labels:
        app: casino-frontend
    spec:
      containers:
        - name: casino-frontend
          image: 477261240280.dkr.ecr.us-east-1.amazonaws.com/casino-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_HOST
              value: "casino-backend"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: casino-frontend
spec:
  selector:
    app: casino-frontend
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer